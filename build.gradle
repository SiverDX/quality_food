plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = minecraft_version + "-" + mod_version
group = mod_group_id

repositories {
    mavenLocal()
    flatDir { dirs 'dev' }
    maven { url = "https://jitpack.io" } // Mixin Squared
    maven { url = "https://www.cursemaven.com" } // CurseForge
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    /* --- Compatibility --- */
    implementation "curse.maven:jade-324717:5846105" // 15.8.2

    compileOnly "curse.maven:harvest-with-ease-602171:5770150" // 9.2.1
    compileOnly "curse.maven:cobweb-968456:5770028" // 1.1.3

    compileOnly "curse.maven:toms-storage-378609:5798154" // 2.0.10

    compileOnly "curse.maven:rightclickharvest-452834:5875092" // 4.4.3
    compileOnly "curse.maven:architectury-api-419699:5786327" // 13.0.8
    compileOnly "curse.maven:jamlib-623764:5841944" // 1.2.2

    compileOnly "curse.maven:farmers-delight-398521:5878217" // 1.2.5

//    compileOnly fg.deobf("curse.maven:fastentitytransfer-828407:5202591") // 1.3.1

    implementation "curse.maven:sophisticated-backpacks-422301:6157673" // 3.23.3.1191
    implementation "curse.maven:sophisticated-storage-619320:6160803" // 1.3.4.1059
    implementation "curse.maven:sophisticated-core-618298:6160815" // 1.2.7.857

//    compileOnly fg.deobf("curse.maven:create-328085:4835191") // 0.5.1f

//    compileOnly fg.deobf("curse.maven:wonderful-enchantments-417439:5114391") // 1.10.7
//    compileOnly fg.deobf("curse.maven:majrusz-library-437409:5085683") // 7.0.5

    compileOnly "curse.maven:lets-do-farm-charm-1038103:5731181" // 1.2.0
    compileOnly "curse.maven:lets-do-vinery-704465:5730909" // 1.5.0
    compileOnly "curse.maven:do-api-864599:5730908" // 1.3.0
    compileOnly "curse.maven:architectury-api-419699:5786327" // 13.0.8

//    compileOnly fg.deobf("curse.maven:quark-243121:5418252") // 4.0-458
//    compileOnly fg.deobf("curse.maven:zeta-968868:5418213") // 1.0-19

//    compileOnly fg.deobf("curse.maven:supplementaries-412082:5458843") // 2.8.17
//    compileOnly fg.deobf("curse.maven:selene-499980:5478857") // 2.12.6

    compileOnly "curse.maven:fastworkbench-288885:5670423" // 9.1.2
    compileOnly "curse.maven:placebo-283644:5869769" // 9.5.4

    implementation "curse.maven:smarter-farmers-farmers-replant-491290:5862217" // 2.1.5
    implementation "curse.maven:selene-499980:5878698" // 2.15.11

    /* --- Test --- */
    implementation "curse.maven:appleskin-248787:5586600" // 3.0.5
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}